openapi: 3.0.3
info:
  title: Prices API
  description: Query of the final price that applies to a product of a brand at a given date.
  version: 1.0.0
servers:
  - url: http://localhost:8080
tags:
  - name: Prices
    description: Applicable prices
paths:
  /prices:
    get:
      tags:
        - Prices
      operationId: getApplicablePrice
      summary: Get the price that applies to a product of a brand at a given date
      description: When several price lists are valid at the given date, the one with the highest priority is returned.
      parameters:
        - name: applicationDate
          in: query
          required: true
          description: Date and time of application, ISO-8601 local date-time.
          schema:
            type: string
            format: date-time
          example: '2020-06-14T10:00:00'
        - name: productId
          in: query
          required: true
          description: Product identifier.
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 35455
        - name: brandId
          in: query
          required: true
          description: Brand identifier (1 = ZARA).
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 1
      responses:
        '200':
          description: Applicable price found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceResponse'
        '400':
          description: Missing or invalid parameters.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No price applies to the product of the brand at the given date.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    PriceResponse:
      type: object
      required:
        - productId
        - brandId
        - priceList
        - startDate
        - endDate
        - price
        - currency
      properties:
        productId:
          type: integer
          format: int64
          example: 35455
        brandId:
          type: integer
          format: int64
          example: 1
        priceList:
          type: integer
          format: int32
          description: Identifier of the applicable price list.
          example: 1
        startDate:
          type: string
          format: date-time
          example: '2020-06-14T00:00:00'
        endDate:
          type: string
          format: date-time
          example: '2020-12-31T23:59:59'
        price:
          type: number
          description: Final sale price.
          example: 35.50
        currency:
          type: string
          description: ISO 4217 currency code.
          example: EUR
    Problem:
      type: object
      description: RFC 9457 problem details.
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
